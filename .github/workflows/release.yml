name: Release

# Publishes a GitHub Release for a version tag in one call and never touches it
# afterwards, so this also works with immutable releases enabled. There is
# nothing to build or upload: this is a library, and Go fetches it from the tag.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the repository's code, so it stays read-only. The write token exists
  # only in the release job, which checks out nothing.
  verify:
    if: github.repository == 'dimchansky/dlx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check that the tag is a Go module version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          # A v2 or later needs a /vN suffix on the module path, or Go rejects it.
          if [[ "$TAG" != v0.* && "$TAG" != v1.* ]]; then
            echo "::error::$TAG needs a /vN module path, which go.mod does not have"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestor check needs origin/master and its history
          persist-credentials: false
      - name: Check that the tagged commit is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on master"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # no dependencies to cache, and a release must not trust one
      - run: go vet ./...
      - run: go test -count=1 ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; not changing it"
            exit 1
          fi
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}"
