<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Two groups of three perpendicular rays. Rays 1, 2 and 3 on the left, rays 1, 4 and 5 on the right. Ray 1 belongs to both groups." font-family="Helvetica, Arial, sans-serif">
<title>Two groups of three perpendicular rays that share ray 1</title>
<rect x="0.5" y="0.5" width="519" height="299" rx="8" fill="#ffffff" stroke="#8c959f"/>
<text x="130" y="26" text-anchor="middle" font-size="15" fill="#24292f">Rays 1, 2, 3</text>
<text x="390" y="26" text-anchor="middle" font-size="15" fill="#24292f">Rays 1, 4, 5</text>
<line x1="210" y1="115" x2="50" y2="185" stroke="#0969da" stroke-width="5"/>
<line x1="50" y1="130" x2="210" y2="170" stroke="#57606a" stroke-width="3"/>
<line x1="130" y1="65" x2="130" y2="235" stroke="#57606a" stroke-width="3"/>
<circle cx="130" cy="150" r="4" fill="#24292f"/>
<text x="34" y="196" font-size="16" font-weight="bold" fill="#0969da">1</text>
<text x="216" y="180" font-size="16" font-weight="bold" fill="#57606a">2</text>
<text x="139" y="72" font-size="16" font-weight="bold" fill="#57606a">3</text>
<line x1="470" y1="115" x2="310" y2="185" stroke="#0969da" stroke-width="5"/>
<line x1="447" y1="104" x2="333" y2="196" stroke="#57606a" stroke-width="3"/>
<line x1="447" y1="224" x2="333" y2="76" stroke="#57606a" stroke-width="3"/>
<circle cx="390" cy="150" r="4" fill="#24292f"/>
<text x="294" y="196" font-size="16" font-weight="bold" fill="#0969da">1</text>
<text x="453" y="102" font-size="16" font-weight="bold" fill="#57606a">4</text>
<text x="453" y="238" font-size="16" font-weight="bold" fill="#57606a">5</text>
<text x="260" y="270" text-anchor="middle" font-size="14" fill="#24292f">Each group is three lines at right angles to each other.</text>
<text x="260" y="289" text-anchor="middle" font-size="14" fill="#24292f">Ray 1 is in both groups, so it must have one colour in both.</text>
</svg>
