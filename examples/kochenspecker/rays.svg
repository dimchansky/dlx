<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Two groups of three perpendicular rays seen at an angle. Rays 1, 2 and 3 on the left, rays 1, 4 and 5 on the right. Ray 1 belongs to both groups." font-family="Helvetica, Arial, sans-serif">
<title>Two groups of three perpendicular rays that share ray 1</title>
<rect x="0.5" y="0.5" width="519" height="299" rx="8" fill="#ffffff" stroke="#8c959f"/>
<text x="130" y="26" text-anchor="middle" font-size="15" fill="#24292f">Rays 1, 2, 3</text>
<text x="390" y="26" text-anchor="middle" font-size="15" fill="#24292f">Rays 1, 4, 5</text>
<line x1="227.9" y1="170.3" x2="32.1" y2="121.7" stroke="#57606a" stroke-width="3"/>
<line x1="170.6" y1="87.2" x2="89.4" y2="204.8" stroke="#57606a" stroke-width="3"/>
<line x1="130" y1="61.2" x2="130" y2="230.8" stroke="#24292f" stroke-width="5"/>
<circle cx="130" cy="146" r="4" fill="#24292f"/>
<text x="130" y="52.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">1</text>
<text x="241.5" y="179.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#57606a">2</text>
<text x="178.5" y="81.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#57606a">3</text>
<line x1="487.9" y1="121.7" x2="292.1" y2="170.3" stroke="#57606a" stroke-width="3"/>
<line x1="430.6" y1="204.8" x2="349.4" y2="87.2" stroke="#57606a" stroke-width="3"/>
<line x1="390" y1="61.2" x2="390" y2="230.8" stroke="#24292f" stroke-width="5"/>
<circle cx="390" cy="146" r="4" fill="#24292f"/>
<text x="390" y="52.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">1</text>
<text x="501.5" y="123.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#57606a">4</text>
<text x="438.5" y="221.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#57606a">5</text>
<text x="260" y="270" text-anchor="middle" font-size="14" fill="#24292f">Seen at an angle: in space, each group is three lines at right angles.</text>
<text x="260" y="289" text-anchor="middle" font-size="14" fill="#24292f">Ray 1 is in both groups, so it must have one colour in both.</text>
</svg>
