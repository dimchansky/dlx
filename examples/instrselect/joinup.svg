<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="The tiling ldr, addi and reg. ldr stops at add, and addi has add as its top node. addi stops at a, and reg has a as its top node." font-family="Helvetica, Arial, sans-serif">
<title>Where one tile stops, the next tile starts</title>
<rect x="0.5" y="0.5" width="759" height="239" rx="8" fill="#ffffff" stroke="#8c959f"/>
<g transform="translate(5 0)">
<line x1="125" y1="45" x2="125" y2="115" stroke="#57606a" stroke-width="2"/>
<line x1="125" y1="115" x2="75" y2="190" stroke="#57606a" stroke-width="2"/>
<line x1="125" y1="115" x2="175" y2="190" stroke="#57606a" stroke-width="2"/>
<circle cx="125" cy="45" r="29" fill="#0969da" fill-opacity="0.22" stroke="#0969da" stroke-width="2"/>
<polyline points="125,115 175,190" fill="none" stroke="#1a7f37" stroke-width="60" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="75" cy="190" r="29" fill="#6e7781" fill-opacity="0.22" stroke="#6e7781" stroke-width="2"/>
<circle cx="125" cy="45" r="21" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
<text x="125" y="50" text-anchor="middle" font-size="15" fill="#24292f">load</text>
<circle cx="125" cy="115" r="21" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
<text x="125" y="120" text-anchor="middle" font-size="15" fill="#24292f">add</text>
<circle cx="75" cy="190" r="21" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
<text x="75" y="195" text-anchor="middle" font-size="15" fill="#24292f">a</text>
<circle cx="175" cy="190" r="21" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
<text x="175" y="195" text-anchor="middle" font-size="15" fill="#24292f">8</text>
<circle cx="125" cy="80" r="11" fill="#24292f"/>
<text x="125" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<circle cx="97" cy="156" r="11" fill="#24292f"/>
<text x="97" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
</g>
<g font-size="15" fill="#24292f">
<circle cx="271" cy="55" r="11" fill="#24292f"/>
<text x="271" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<text x="292" y="50">ldr covers load and stops at add, so it reads the value of add.</text>
<text x="292" y="72">The tile on add can't also cover load, because ldr has load.</text>
<text x="292" y="94">So add is that tile's top node. Here the tile is addi, and it</text>
<text x="292" y="116">leaves exactly the value that ldr reads.</text>
<circle cx="271" cy="161" r="11" fill="#24292f"/>
<text x="271" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
<text x="292" y="156">addi covers add and 8, and stops at a, so it reads the value of a.</text>
<text x="292" y="178">The tile on a can't also cover add, because addi has add.</text>
<text x="292" y="200">So a is that tile's top node. Here the tile is reg.</text>
</g>
</svg>
